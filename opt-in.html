<!DOCTYPE html>
<html>
<head>
  <title>Follow Up SMS Opt-In</title>
</head>
<body>
  <h1>Follow Up SMS Opt-In</h1>

  <p>
    Follow Up sends bill reminder notifications and payment status updates
    related to bills created by users in the app.
  </p>

  <form>
    <label>
      Phone number:
      <input type="tel" placeholder="+1XXXXXXXXXX" />
    </label>

    <br><br>

    <label>
      <input type="checkbox" />
      I authorize Follow Up to send automated SMS messages containing bill reminder
      notifications and payment status updates to the phone number provided.
      Message and data rates may apply. Message frequency varies based on active
      bill reminders and may be up to once every 24 hours per active bill.
      Reply HELP for help or STOP with the bill ID to opt out. Consent is not a
      condition of purchase.
    </label>

    <p>
      See our <a href="privacy.html">Privacy Policy</a> and
      <a href="terms.html">Terms and Conditions</a>.
    </p>
  </form>
</body>
</html>
